name: Build VoidBreaker

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [ published ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: VoidBreaker-Linux
            asset_name: VoidBreaker-Linux.tar.gz
          - os: windows-latest
            artifact_name: VoidBreaker-Windows
            asset_name: VoidBreaker-Windows.zip
          - os: macos-latest
            artifact_name: VoidBreaker-macOS
            asset_name: VoidBreaker-macOS.zip

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt 6
      uses: jurplel/install-qt@v3
      with:
        version: '6.5.3'
        host: ${{ runner.os == 'Windows' && 'windows' || (runner.os == 'macOS' && 'mac' || 'linux') }}
        target: 'desktop'

    - name: Setup Ninja (Ubuntu & Windows)
      uses: llvm/actions/install-ninja@v1

    - name: Configure CMake
      run: |
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build C++ Project
      run: |
        cmake --build build --config Release

    - name: Package Windows Release (Deploy Qt DLLs)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        mkdir package
        Copy-Item build/Release/VoidBreaker.exe package/
        windeployqt --no-compiler-runtime package/VoidBreaker.exe
        Compress-Archive -Path package/* -DestinationPath VoidBreaker-Windows.zip

    - name: Package macOS Release (Deploy Qt Frameworks)
      if: runner.os == 'macOS'
      run: |
        mkdir package
        cp -r build/VoidBreaker.app package/
        macdeployqt package/VoidBreaker.app -dmg
        zip -r VoidBreaker-macOS.zip package/

    - name: Package Linux Release
      if: runner.os == 'Linux'
      run: |
        mkdir package
        cp build/VoidBreaker package/
        tar -czvf VoidBreaker-Linux.tar.gz -C package .

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          *.zip
          *.tar.gz
          *.dmg

    - name: Upload Binaries to GitHub Release
      if: github.event_name == 'release' && github.event.action == 'published'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          *.zip
          *.tar.gz
          *.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
