name: Build VoidBreaker

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: win64_msvc2019_64
            artifact_name: VoidBreaker-Windows
          - os: macos-latest
            arch: clang_64
            artifact_name: VoidBreaker-macOS

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt 6
      uses: jurplel/install-qt@v3
      with:
        version: '6.6.2'
        arch: ${{ matrix.arch }}

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build C++ Project
      run: cmake --build build --config Release

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path package
        if (Test-Path build/Release/VoidBreaker.exe) {
          Copy-Item build/Release/VoidBreaker.exe package/
        } else if (Test-Path build/VoidBreaker.exe) {
          Copy-Item build/VoidBreaker.exe package/
        }
        windeployqt package/VoidBreaker.exe
        Compress-Archive -Path package/* -DestinationPath VoidBreaker-Windows.zip

    - name: Package (macOS)
      if: runner.os == 'macOS'
      run: |
        mkdir -p package
        cp -r build/VoidBreaker.app package/
        macdeployqt package/VoidBreaker.app -dmg
        zip -r VoidBreaker-macOS.zip package/

    - name: Upload Binaries to GitHub Release
      if: github.event_name == 'release' && github.event.action == 'published'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          *.zip
          *.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
