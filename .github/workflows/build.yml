name: Build VoidBreaker

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Linux Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1-mesa-dev libxcb-cursor0 libxcb-xinerama0

    - name: Install Qt 6
      uses: jurplel/install-qt@v4
      with:
        version: '6.5.3'

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build C++ Project
      run: cmake --build build --config Release

    - name: Package (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        mkdir package
        if (Test-Path build/Release/VoidBreaker.exe) {
          Copy-Item build/Release/VoidBreaker.exe package/
        } else {
          Copy-Item build/VoidBreaker.exe package/
        }
        windeployqt package/VoidBreaker.exe
        Compress-Archive -Path package/* -DestinationPath VoidBreaker-Windows.zip

    - name: Package (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        mkdir package
        cp -r build/VoidBreaker.app package/
        macdeployqt package/VoidBreaker.app -dmg
        zip -r VoidBreaker-macOS.zip package/

    - name: Package (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        mkdir package
        cp build/VoidBreaker package/
        tar -czvf VoidBreaker-Linux.tar.gz -C package .

    - name: Upload Artifacts to Release
      if: github.event_name == 'release' && github.event.action == 'published'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          *.zip
          *.tar.gz
          *.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
