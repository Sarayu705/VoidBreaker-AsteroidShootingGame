name: Build VoidBreaker

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Release
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt 6 via Homebrew
      run: |
        brew install qt@6
        echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6) -DCMAKE_BUILD_TYPE=Release

    - name: Build C++ Project
      run: cmake --build build --config Release

    - name: Package macOS App
      run: |
        mkdir -p package
        cp -r build/VoidBreaker.app package/
        $(brew --prefix qt@6)/bin/macdeployqt package/VoidBreaker.app -dmg
        zip -r VoidBreaker-macOS.zip package/

    - name: Upload macOS Release Binaries
      if: github.event_name == 'release' && github.event.action == 'published'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          VoidBreaker-macOS.zip
          package/VoidBreaker.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
